<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WorkNest Access Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>

<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2" />
          <circle cx="12" cy="16" r="1.5" fill="currentColor" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
      </div>
      <div class="brand-text">
        <span class="title">WorkNest</span>
        <span class="subtitle"><span class="live-dot"></span> Access Control</span>
      </div>
    </div>

    <nav class="nav-menu">
      <a data-view="dashboard" class="nav-item active">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" rx="1.5" />
          <rect x="14" y="3" width="7" height="5" rx="1.5" />
          <rect x="14" y="12" width="7" height="9" rx="1.5" />
          <rect x="3" y="16" width="7" height="5" rx="1.5" />
        </svg>
        <span>Dashboard</span>
      </a>
      <a data-view="devices" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2.5" width="14" height="19" rx="2.5" />
          <circle cx="12" cy="9" r="2.5" />
          <path d="M8.5 17h7" />
        </svg>
        <span>Machines</span>
      </a>
      <a data-view="users" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>Users</span>
      </a>
      <a data-view="cards" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5" />
          <line x1="2.5" y1="10" x2="21.5" y2="10" />
          <line x1="6.5" y1="15" x2="10.5" y2="15" />
        </svg>
        <span>Cards</span>
      </a>
      <a data-view="logs" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
        </svg>
        <span>Activity Log</span>
      </a>
      <a data-view="dashusers" class="nav-item" id="navDashUsers" style="display:none">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="8" r="3.5" />
          <path d="M2.5 20c.7-3.2 3.2-5 6.5-5s5.8 1.8 6.5 5" />
          <path d="M17.5 4.5l4 4" />
          <path d="M19.5 2.5l2 2-5.5 5.5-2.5.5.5-2.5z" />
        </svg>
        <span>Dashboard Users</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="auth-row">
        <button id="changePass" class="btn sm" type="button">Password</button>
        <button id="logout" class="btn sm" type="button">Log out</button>
      </div>
      <button id="syncAll" class="sync-all-btn">
        <svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6" />
          <path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16" />
        </svg>
        <span>Sync All Pending</span>
      </button>
    </div>
  </aside>

  <main class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <div class="breadcrumb">
          <span class="crumb-root">WorkNest</span> / <span class="crumb-current" id="viewBreadcrumb">Dashboard</span>
        </div>
        <h1 id="viewTitle">Dashboard</h1>
      </div>
      <div class="topbar-right">
        <div class="search-box" id="globalSearchContainer" hidden>
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="globalSearch" placeholder="Search..." autocomplete="off" />
        </div>
        <button id="themeToggle" class="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Light / Dark Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <div class="actions" id="viewActions"></div>
      </div>
    </header>
    <section id="content" class="content-body"></section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/app.js" type="module"></script>
</body>

</html>
